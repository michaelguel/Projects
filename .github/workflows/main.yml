name: Copy Files from Another Repository

on:
  workflow_dispatch:  # Allows manual trigger from GitHub Actions

jobs:
  copy-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repo
        uses: actions/checkout@v3

      - name: Fetch source repo files
        run: |
          git clone --depth 1 https://github.com/michaelguel/EmotionCoreML.git temp-repo
          mkdir -p project/projectsdirect/EmotionRecognition  # Ensure target folder exists
          cp -r temp-repo/. project/projectsdirect/EmotionRecognition/
          rm -rf temp-repo

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Copied files from EmotionCoreML into project/projectsdirect/EmotionRecognition"
          git push origin main


