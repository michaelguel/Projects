name: Copy Files from Another Repository

on:
  workflow_dispatch:  # Allows manual trigger from GitHub Actions

jobs:
  copy-files:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout destination repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}  # Use PAT for authentication

      - name: Fetch source repo files
        run: |
          git clone --depth 1 https://github.com/michaelguel/CSE847-Project.git temp-repo
          mkdir -p ProjectsDirect/EmotionRecognition/DataModelTraining  # Ensure target folder exists
          cp -r temp-repo/. ProjectsDirect/EmotionRecognition/DataModelTraining/
          rm -rf temp-repo


      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/michaelguel/Projects.git
          git add .
          git diff --cached --quiet || git commit -m "Copied files from CSE847-Project into ProjectsDirect/EmotionRecognition/DataModelTraining"
          git push origin main




